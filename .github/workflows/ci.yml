name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  client:
    name: Client (eslint + tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --pretty false

  server:
    name: Server (tsc + integration tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: testroot
          MYSQL_DATABASE: cs_quiz_test
          MYSQL_USER: quiz_dev
          MYSQL_PASSWORD: quiz_dev_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptestroot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx tsc --pretty false
      - name: Install mysql client
        working-directory: .
        run: sudo apt-get update && sudo apt-get install -y mysql-client
      - name: Apply schema to cs_quiz_test
        run: |
          sed 's/^USE cs_quiz;/USE cs_quiz_test;/' sql/001_schema.sql \
            | mysql -h 127.0.0.1 -P 3306 -uroot -ptestroot
      - name: Write .env.test
        run: |
          cat > .env.test <<'EOF'
          NODE_ENV=test
          PORT=0
          LOG_LEVEL=error
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_NAME=cs_quiz_test
          DB_USER_DEV=quiz_dev
          DB_PASSWORD_DEV=quiz_dev_ci
          JWT_SECRET=test_jwt_secret_ci
          CORS_ORIGIN_LOCAL=http://localhost:5173
          GOOGLE_CLIENT_ID=dummy-google-client-id
          GOOGLE_CLIENT_SECRET=dummy-google-client-secret
          GOOGLE_CALLBACK_URL=http://localhost/api/auth/google/callback
          GITHUB_CLIENT_ID=dummy-github-client-id
          GITHUB_CLIENT_SECRET=dummy-github-client-secret
          GITHUB_CALLBACK_URL=http://localhost/api/auth/github/callback
          EOF
      - run: npm test
